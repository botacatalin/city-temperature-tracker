<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>City Temperature Tracker</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: #e2e8f0;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eef4ff, var(--bg));
      color: var(--text);
      padding: 28px 14px;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.25rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .stat {
      padding: 18px;
    }

    .label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .value {
      font-size: 1.7rem;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      padding: 14px;
      margin-bottom: 16px;
    }

    input, select {
      flex: 1;
      min-width: 190px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 13px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .chart-card {
      padding: 18px;
      margin-bottom: 16px;
    }

    .chart-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    svg {
      width: 100%;
      height: 260px;
      display: block;
    }

    .table-scroll {
      max-height: 620px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      z-index: 1;
    }

    .temp {
      display: inline-flex;
      min-width: 74px;
      justify-content: center;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
    }

    .status {
      padding: 26px;
      text-align: center;
      color: var(--muted);
    }

    .error { color: var(--danger); }

    footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>City Temperature Tracker</h1>
      <p class="subtitle">UTC temperature history powered by <strong>OpenWeatherMap</strong>.</p>
    </header>

    <section id="stats" class="grid"></section>

    <section class="card toolbar">
      <select id="locationFilter" aria-label="Filter by location">
        <option value="all">All locations</option>
      </select>
      <select id="sort">
        <option value="date-desc">Newest first</option>
        <option value="date-asc">Oldest first</option>
        <option value="temp-desc">Highest temperature</option>
        <option value="temp-asc">Lowest temperature</option>
        <option value="location-asc">Location A-Z</option>
      </select>
    </section>

    <section class="card chart-card">
      <div class="chart-title">
        <div>
          <strong>Temperature evolution</strong>
          <div style="font-size:0.82rem;color:#64748b;margin-top:4px;">
            Explore temperature trends over the last week, month, year, or across the full dataset.
          </div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
          <select id="rangeFilter" style="min-width:auto;padding:8px 12px;font-size:0.9rem;">
            <option value="week">Week</option>
            <option value="month">Month</option>
            <option value="year">Year</option>
            <option value="all" selected>All</option>
          </select>
          <span id="chartHint">°C over time</span>
        </div>
      </div>
      <svg id="chart" viewBox="0 0 900 260" role="img" aria-label="Temperature evolution chart"></svg>
    </section>

    <section class="card table-scroll">
      <div id="status" class="status">Loading data...</div>
      <table id="table" hidden>
        <thead>
          <tr>
            <th>Date UTC</th>
            <th>Location</th>
            <th>Temperature</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <footer>Data refreshes when the page loads.</footer>
  </main>

  <script>
    const JSON_FILE = "https://raw.githubusercontent.com/botacatalin/city-temperature-tracker/main/temperatures.json";
    const stats = document.getElementById("stats");
    const status = document.getElementById("status");
    const table = document.getElementById("table");
    const rows = document.getElementById("rows");
    const locationFilter = document.getElementById("locationFilter");
    const sort = document.getElementById("sort");
    const chart = document.getElementById("chart");
    const chartHint = document.getElementById("chartHint");
    const rangeFilter = document.getElementById("rangeFilter");

    let data = [];

    fetch(JSON_FILE, { cache: "no-store" })
      .then((res) => {
        if (!res.ok) throw new Error("Could not load temperature data from GitHub.");
        return res.json();
      })
      .then((json) => {
        data = Array.isArray(json) ? json.map(cleanRecord).filter(Boolean) : [];
        populateLocationFilter();
        render();
      })
      .catch((err) => {
        status.innerHTML = `<span class="error">${escapeHtml(err.message)}</span>`;
      });

    function cleanRecord(item) {
      if (!item || !item.date || !item.location || item.temperature === undefined) return null;

      return {
        date: item.date,
        location: String(item.location),
        temperature: Number(item.temperature),
        unit: item.unit || "celsius",
      };
    }

    function populateLocationFilter() {
      const locations = [...new Set(data.map((item) => item.location))].sort((a, b) => a.localeCompare(b));

      locationFilter.innerHTML = `
        <option value="all">All locations</option>
        ${locations.map((location) => `<option value="${escapeHtml(location)}">${escapeHtml(location)}</option>`).join("")}
      `;

      if (locations.includes("Cluj-Napoca")) {
        locationFilter.value = "Cluj-Napoca";
      }
    }

    function render() {
      const selectedLocation = locationFilter.value;
      const filtered = data
        .filter((item) => selectedLocation === "all" || item.location === selectedLocation)
        .sort(sortRecords);

      const chartData = filterByRange(filtered)
        .slice()
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      renderStats(filtered);
      renderChart(chartData);
      renderTable(filtered);
    }

    function sortRecords(a, b) {
      if (sort.value === "date-asc") return new Date(a.date) - new Date(b.date);
      if (sort.value === "date-desc") return new Date(b.date) - new Date(a.date);
      if (sort.value === "temp-asc") return a.temperature - b.temperature;
      if (sort.value === "temp-desc") return b.temperature - a.temperature;
      if (sort.value === "location-asc") return a.location.localeCompare(b.location);
      return 0;
    }

    function renderStats(items) {
      const temps = items.map((item) => item.temperature).filter(Number.isFinite);
      const avg = temps.length ? temps.reduce((sum, temp) => sum + temp, 0) / temps.length : null;
      const max = temps.length ? Math.max(...temps) : null;
      const min = temps.length ? Math.min(...temps) : null;

      stats.innerHTML = `
        ${statCard("Records", items.length)}
        ${statCard("Average", formatTemp(avg))}
        ${statCard("Highest", formatTemp(max))}
        ${statCard("Lowest", formatTemp(min))}
      `;
    }

    function statCard(label, value) {
      return `
        <article class="card stat">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </article>
      `;
    }

    function renderTable(items) {
      if (!items.length) {
        table.hidden = true;
        status.hidden = false;
        status.textContent = "No records found.";
        return;
      }

      rows.innerHTML = items.map((item) => `
        <tr>
          <td>${formatUTC(item.date)}</td>
          <td>${escapeHtml(item.location)}</td>
          <td><span class="temp">${formatTemp(item.temperature)}</span></td>
        </tr>
      `).join("");

      status.hidden = true;
      table.hidden = false;
    }

    function filterByRange(items) {
      const mode = rangeFilter.value;

      if (mode === "all") return items;

      const now = new Date();
      const limit = new Date();

      if (mode === "week") {
        limit.setDate(now.getDate() - 7);
      } else if (mode === "month") {
        limit.setMonth(now.getMonth() - 1);
      } else if (mode === "year") {
        limit.setFullYear(now.getFullYear() - 1);
      }

      return items.filter((item) => new Date(item.date) >= limit);
    }

    function renderChart(items) {
      chart.innerHTML = "";
      const points = items.filter((item) => Number.isFinite(item.temperature));

      if (points.length < 2) {
        chartHint.textContent = "Add at least 2 records to show a trend";
        chart.innerHTML = `<text x="450" y="135" text-anchor="middle" fill="#64748b">Not enough data for chart</text>`;
        return;
      }

      chartHint.textContent = `${points.length} readings`;

      const width = 900;
      const height = 260;
      const pad = 34;
      const minTemp = Math.min(...points.map((p) => p.temperature));
      const maxTemp = Math.max(...points.map((p) => p.temperature));
      const range = maxTemp - minTemp || 1;

      const x = (index) => pad + (index / (points.length - 1)) * (width - pad * 2);
      const y = (temp) => height - pad - ((temp - minTemp) / range) * (height - pad * 2);

      const path = points
        .map((point, index) => `${index === 0 ? "M" : "L"} ${x(index)} ${y(point.temperature)}`)
        .join(" ");

      chart.innerHTML = `
        <line x1="${pad}" y1="${height - pad}" x2="${width - pad}" y2="${height - pad}" stroke="#cbd5e1" />
        <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${height - pad}" stroke="#cbd5e1" />
        <text x="${pad}" y="22" fill="#64748b" font-size="13">${formatTemp(maxTemp)}</text>
        <text x="${pad}" y="${height - 8}" fill="#64748b" font-size="13">${formatTemp(minTemp)}</text>
        <path d="${path}" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
        ${points.map((point, index) => `
          <circle cx="${x(index)}" cy="${y(point.temperature)}" r="5" fill="#2563eb">
            <title>${formatUTC(point.date)} — ${formatTemp(point.temperature)}</title>
          </circle>
        `).join("")}
      `;
    }

    function formatTemp(value) {
      return Number.isFinite(value) ? `${value.toFixed(1)}°C` : "—";
    }

    function formatUTC(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return escapeHtml(value);

      return date.toLocaleString(undefined, {
        timeZone: "UTC",
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        timeZoneName: "short"
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    locationFilter.addEventListener("change", render);
    sort.addEventListener("change", render);
    rangeFilter.addEventListener("change", render);
  </script>
</body>
</html>
